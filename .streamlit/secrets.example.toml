# Copy to .streamlit/secrets.toml and configure locally. NEVER commit that file.
# This example contains placeholders, not usable credentials.
[app]
mode = "restricted"

[auth]
redirect_uri = "http://localhost:8501/oauth2callback"
cookie_secret = "REPLACE_WITH_RANDOM_SECRET"
client_id = "REPLACE_WITH_OIDC_CLIENT_ID"
client_secret = "REPLACE_WITH_OIDC_CLIENT_SECRET"
server_metadata_url = "https://YOUR_OIDC_PROVIDER/.well-known/openid-configuration"

[groq]
api_key = "REPLACE_WITH_GROQ_KEY"
model = "openai/gpt-oss-20b"

# Use the exact issuer and subject delivered by your configured OIDC provider.
# Patient keys currently match the synthetic names in PACIENTES_INICIALES.
[[access.users]]
issuer = "https://YOUR_OIDC_PROVIDER"
subject = "REPLACE_WITH_PATIENT_SUBJECT"
role = "Paciente"
patients = ["María González"]

[[access.users]]
issuer = "https://YOUR_OIDC_PROVIDER"
subject = "REPLACE_WITH_REVIEWER_SUBJECT"
role = "Enfermería"
patients = ["María González", "Carlos Muñoz"]

[[access.users]]
issuer = "https://YOUR_OIDC_PROVIDER"
subject = "REPLACE_WITH_CLINICIAN_SUBJECT"
role = "Equipo tratante"
patients = ["María González", "Carlos Muñoz", "Ana Silva", "Pedro Morales"]

# Optional local prototype accounts. Configure only for MINDELINE_MODE=demo.
# Generate each hash locally with:
# python -c "from security import hash_demo_password; import getpass; print(hash_demo_password(getpass.getpass('Password (12+ characters): ')))"
# Never reuse real passwords. A demo account is not a production authentication system.
[[demo.users]]
username = "paciente_demo"
password_hash = "REPLACE_WITH_PBKDF2_HASH"
role = "Paciente"
patients = ["María González"]

[[demo.users]]
username = "enfermeria_demo"
password_hash = "REPLACE_WITH_PBKDF2_HASH"
role = "Enfermería"
patients = ["María González", "Carlos Muñoz"]

[[demo.users]]
username = "clinico_demo"
password_hash = "REPLACE_WITH_PBKDF2_HASH"
role = "Equipo tratante"
patients = ["María González", "Carlos Muñoz", "Ana Silva", "Pedro Morales"]
